<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Contact Form</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 750px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .top-nav { margin-bottom: 16px; }
    .top-nav a { color: var(--primary); text-decoration: none; font-weight: 600; }

    h2, h3 { margin-top: 0; color: var(--primary); }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    .photo-preview {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      border: 2px dashed var(--border);
      object-fit: cover;
      display: block;
      margin-top: 8px;
    }

    .map-container {
      width: 100%;
      height: 180px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    iframe { width: 100%; height: 100%; border: 0; }

    .family-card {
      border: 1px solid var(--border);
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .family-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-secondary { background-color: #64748b; }
    .btn-success { background-color: var(--success); }
    .btn-danger { background-color: #ef4444; }
    .btn-submit { width: 100%; padding: 12px; font-size: 1rem; margin-top: 16px; }

    .action-bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="home.html">← Back to Contacts</a>
  </div>

  <h2 id="formTitle">Contact Entry Form</h2>
  <form id="contactForm" onsubmit="handleFormSubmit(event)">
    <input type="hidden" id="contactId">
    
    <div class="form-group">
      <label for="photoInput">Profile Photo</label>
      <input type="file" id="photoInput" class="photo-file" accept="image/*" onchange="handlePhotoSelect(event, 'photoPreview')">
      <img id="photoPreview" class="photo-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%2394a3b8' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
    </div>

    <div class="form-group">
      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName" required placeholder="John Doe">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" required placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="aadhaar">Aadhaar Number</label>
        <input type="text" id="aadhaar" placeholder="XXXX-XXXX-XXXX" maxlength="14" oninput="formatAadhaar(this)">
      </div>
      <div class="form-group">
        <label for="pan">PAN Card Number</label>
        <input type="text" id="pan" placeholder="ABCDE1234F" maxlength="10" style="text-transform: uppercase;">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="latitude">Latitude</label>
        <input type="number" step="any" id="latitude" placeholder="28.6139" onchange="syncLocation('latitude', 'longitude', 'digipin', 'mapFrame')">
      </div>
      <div class="form-group">
        <label for="longitude">Longitude</label>
        <input type="number" step="any" id="longitude" placeholder="77.2090" onchange="syncLocation('latitude', 'longitude', 'digipin', 'mapFrame')">
      </div>
    </div>

    <div class="form-group">
      <label for="digipin">DIGIPIN (Auto-generated)</label>
      <input type="text" id="digipin" placeholder="e.g. 3J8-2K1-L09" onchange="syncDigipin('digipin', 'latitude', 'longitude', 'mapFrame')">
    </div>

    <div class="form-group">
      <button type="button" class="btn-secondary" onclick="getCurrentLocation('latitude', 'longitude', 'digipin', 'mapFrame')">Get Current Location</button>
    </div>

    <div class="form-group">
      <label>Location Preview</label>
      <div class="map-container">
        <iframe id="mapFrame" src="about:blank"></iframe>
      </div>
    </div>

    <hr style="margin: 24px 0; border: 0; border-top: 1px solid var(--border);">

    <div class="form-group">
      <h3>Family Members (Optional)</h3>
      <div id="familyContainer"></div>
      <button type="button" class="btn-secondary" onclick="addFamilyMember()">+ Add Family Member</button>
    </div>

    <button type="submit" class="btn-submit">Save Contact to Browser</button>

    <div class="action-bar">
      <button type="button" class="btn-success" onclick="exportSingle('json')">Save as JSON</button>
      <button type="button" class="btn-secondary" onclick="copySingle('json')">Copy as JSON</button>
      <button type="button" class="btn-success" onclick="exportSingle('csv')">Save as CSV</button>
      <button type="button" class="btn-secondary" onclick="copySingle('csv')">Copy as CSV</button>
    </div>
  </form>
</div>

<script>
  // DIGIPIN Engine
  const DIGIPIN_GRID = [['2','3','4','5'],['6','7','8','9'],['C','J','K','L'],['M','P','T','W']];
  const BOUNDS = { minLat: 2.0, maxLat: 38.0, minLng: 60.0, maxLng: 100.0 };

  function latLngToDigipin(lat, lng) {
    lat = parseFloat(lat); lng = parseFloat(lng);
    if (isNaN(lat) || isNaN(lng) || lat < BOUNDS.minLat || lat > BOUNDS.maxLat || lng < BOUNDS.minLng || lng > BOUNDS.maxLng) return '';
    let minLat = BOUNDS.minLat, maxLat = BOUNDS.maxLat, minLng = BOUNDS.minLng, maxLng = BOUNDS.maxLng, code = '';
    for (let i = 0; i < 10; i++) {
      let latStep = (maxLat - minLat) / 4, lngStep = (maxLng - minLng) / 4;
      let col = Math.max(0, Math.min(3, Math.floor((lng - minLng) / lngStep)));
      let row = Math.max(0, Math.min(3, Math.floor((maxLat - lat) / latStep)));
      code += DIGIPIN_GRID[row][col];
      maxLat -= row * latStep; minLat = maxLat - latStep;
      minLng += col * lngStep; maxLng = minLng + lngStep;
    }
    return `${code.slice(0, 3)}-${code.slice(3, 6)}-${code.slice(6)}`;
  }

  function digipinToLatLng(code) {
    let clean = (code || '').replace(/[^2-9C-WC-wj-wj-w]/gi, '').toUpperCase();
    if (clean.length !== 10) return null;
    let minLat = BOUNDS.minLat, maxLat = BOUNDS.maxLat, minLng = BOUNDS.minLng, maxLng = BOUNDS.maxLng;
    for (let char of clean) {
      let r = -1, c = -1;
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) { if (DIGIPIN_GRID[i][j] === char) { r = i; c = j; break; } }
      }
      if (r === -1) return null;
      let latStep = (maxLat - minLat) / 4, lngStep = (maxLng - minLng) / 4;
      let newMaxLat = maxLat - r * latStep;
      minLat = newMaxLat - latStep; maxLat = newMaxLat;
      let newMinLng = minLng + c * lngStep;
      minLng = newMinLng; maxLng = newMinLng + lngStep;
    }
    return { lat: ((minLat + maxLat) / 2).toFixed(6), lng: ((minLng + maxLng) / 2).toFixed(6) };
  }

  function syncLocation(latId, lngId, digipinId, frameId) {
    const lat = document.getElementById(latId).value, lng = document.getElementById(lngId).value;
    if (lat && lng) {
      document.getElementById(digipinId).value = latLngToDigipin(lat, lng);
      document.getElementById(frameId).src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
    }
  }

  function syncDigipin(digipinId, latId, lngId, frameId) {
    const coords = digipinToLatLng(document.getElementById(digipinId).value);
    if (coords) {
      document.getElementById(latId).value = coords.lat;
      document.getElementById(lngId).value = coords.lng;
      document.getElementById(frameId).src = `https://maps.google.com/maps?q=${coords.lat},${coords.lng}&z=15&output=embed`;
    }
  }

  function getCurrentLocation(latId, lngId, digipinId, frameId) {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(p => {
        document.getElementById(latId).value = p.coords.latitude;
        document.getElementById(lngId).value = p.coords.longitude;
        syncLocation(latId, lngId, digipinId, frameId);
      });
    }
  }

  function formatAadhaar(el) {
    let v = el.value.replace(/\D/g, '').slice(0, 12);
    el.value = v.match(/.{1,4}/g)?.join('-') || '';
  }

  function fileToBase64(file) {
    return new Promise((res) => {
      if (!file) return res('');
      const r = new FileReader();
      r.readAsDataURL(file);
      r.onload = () => res(r.result);
    });
  }

  async function handlePhotoSelect(e, imgId) {
    const file = e.target.files[0];
    if (file) {
      const b64 = await fileToBase64(file);
      document.getElementById(imgId).src = b64;
    }
  }

  let famCount = 0;
  function addFamilyMember(data = {}) {
    famCount++;
    const id = famCount;
    const card = document.createElement('div');
    card.className = 'family-card';
    card.id = `fam_${id}`;
    card.innerHTML = `
      <div class="family-card-header">
        <strong>Family Member #${id}</strong>
        <button type="button" class="btn-danger" onclick="document.getElementById('fam_${id}').remove()">X</button>
      </div>
      <div class="row">
        <div class="form-group"><label>Name</label><input type="text" class="fam-name" value="${data.name || ''}"></div>
        <div class="form-group"><label>Relation</label>
          <select class="fam-relation">
            <option value="Spouse">Spouse</option><option value="Child">Child</option><option value="Parent">Parent</option><option value="Sibling">Sibling</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group"><label>Phone</label><input type="tel" class="fam-phone" value="${data.phone || ''}"></div>
        <div class="form-group"><label>Email</label><input type="email" class="fam-email" value="${data.email || ''}"></div>
      </div>
      <div class="form-group">
        <label>Photo</label>
        <input type="file" class="fam-photo-file" accept="image/*" onchange="handlePhotoSelect(event, 'fam_img_${id}')">
        <img id="fam_img_${id}" class="photo-preview" src="${data.photo || 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'%2394a3b8\' viewBox=\'0 0 24 24\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'}">
      </div>
      <div class="row">
        <div class="form-group"><label>Aadhaar</label><input type="text" class="fam-aadhaar" value="${data.aadhaar || ''}" oninput="formatAadhaar(this)"></div>
        <div class="form-group"><label>PAN</label><input type="text" class="fam-pan" value="${data.pan || ''}"></div>
      </div>
      <div class="row">
        <div class="form-group"><label>Latitude</label><input type="number" step="any" id="fam_lat_${id}" class="fam-lat" value="${data.lat || ''}" onchange="syncLocation('fam_lat_${id}', 'fam_lng_${id}', 'fam_digi_${id}', 'fam_map_${id}')"></div>
        <div class="form-group"><label>Longitude</label><input type="number" step="any" id="fam_lng_${id}" class="fam-lng" value="${data.lng || ''}" onchange="syncLocation('fam_lat_${id}', 'fam_lng_${id}', 'fam_digi_${id}', 'fam_map_${id}')"></div>
      </div>
      <div class="form-group"><label>DIGIPIN</label><input type="text" id="fam_digi_${id}" class="fam-digipin" value="${data.digipin || ''}" onchange="syncDigipin('fam_digi_${id}', 'fam_lat_${id}', 'fam_lng_${id}', 'fam_map_${id}')"></div>
      <div class="map-container"><iframe id="fam_map_${id}" src="about:blank"></iframe></div>
    `;
    document.getElementById('familyContainer').appendChild(card);
  }

  async function buildContactPayload() {
    const familyMembers = [];
    document.querySelectorAll('.family-card').forEach(card => {
      familyMembers.push({
        name: card.querySelector('.fam-name').value,
        relation: card.querySelector('.fam-relation').value,
        phone: card.querySelector('.fam-phone').value,
        email: card.querySelector('.fam-email').value,
        photo: card.querySelector('.photo-preview').src,
        aadhaar: card.querySelector('.fam-aadhaar').value,
        pan: card.querySelector('.fam-pan').value,
        digipin: card.querySelector('.fam-digipin').value,
        lat: card.querySelector('.fam-lat').value,
        lng: card.querySelector('.fam-lng').value
      });
    });

    return {
      id: document.getElementById('contactId').value || 'id_' + Date.now(),
      fullName: document.getElementById('fullName').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      photo: document.getElementById('photoPreview').src,
      aadhaar: document.getElementById('aadhaar').value,
      pan: document.getElementById('pan').value,
      digipin: document.getElementById('digipin').value,
      coordinates: {
        lat: document.getElementById('latitude').value,
        lng: document.getElementById('longitude').value
      },
      familyMembers
    };
  }

  async function handleFormSubmit(e) {
    e.preventDefault();
    const payload = await buildContactPayload();
    let contacts = JSON.parse(localStorage.getItem('saved_contacts') || '[]');
    const idx = contacts.findIndex(c => c.id === payload.id);
    if (idx > -1) contacts[idx] = payload;
    else contacts.push(payload);
    localStorage.setItem('saved_contacts', JSON.stringify(contacts));
    alert("Saved!");
    window.location.href = "home.html";
  }

  function getFilename(ext) {
    const d = new Date();
    return `${String(d.getDate()).padStart(2,'0')}${String(d.getMonth()+1).padStart(2,'0')}${d.getFullYear()}.${ext}`;
  }

  async function exportSingle(format) {
    const payload = await buildContactPayload();
    if (format === 'json') {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = getFilename("json"); a.click();
    } else {
      const esc = s => `"${String(s || '').replace(/"/g, '""')}"`;
      const csv = `ID,FullName,Phone,Email,Aadhaar,PAN,DIGIPIN,Latitude,Longitude,Photo\n${esc(payload.id)},${esc(payload.fullName)},${esc(payload.phone)},${esc(payload.email)},${esc(payload.aadhaar)},${esc(payload.pan)},${esc(payload.digipin)},${esc(payload.coordinates.lat)},${esc(payload.coordinates.lng)},${esc(payload.photo)}`;
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = getFilename("csv"); a.click();
    }
  }

  async function copySingle(format) {
    const payload = await buildContactPayload();
    if (format === 'json') {
      navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
    } else {
      const esc = s => `"${String(s || '').replace(/"/g, '""')}"`;
      const csv = `ID,FullName,Phone,Email,Aadhaar,PAN,DIGIPIN,Latitude,Longitude,Photo\n${esc(payload.id)},${esc(payload.fullName)},${esc(payload.phone)},${esc(payload.email)},${esc(payload.aadhaar)},${esc(payload.pan)},${esc(payload.digipin)},${esc(payload.coordinates.lat)},${esc(payload.coordinates.lng)},${esc(payload.photo)}`;
      navigator.clipboard.writeText(csv);
    }
    alert(`${format.toUpperCase()} copied to clipboard!`);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const id = new URLSearchParams(window.location.search).get('id');
    if (id) {
      const contacts = JSON.parse(localStorage.getItem('saved_contacts') || '[]');
      const c = contacts.find(i => i.id === id);
      if (c) {
        document.getElementById('contactId').value = c.id;
        document.getElementById('fullName').value = c.fullName || '';
        document.getElementById('phone').value = c.phone || '';
        document.getElementById('email').value = c.email || '';
        document.getElementById('photoPreview').src = c.photo || '';
        document.getElementById('aadhaar').value = c.aadhaar || '';
        document.getElementById('pan').value = c.pan || '';
        document.getElementById('digipin').value = c.digipin || '';
        if (c.coordinates) {
          document.getElementById('latitude').value = c.coordinates.lat || '';
          document.getElementById('longitude').value = c.coordinates.lng || '';
          syncLocation('latitude', 'longitude', 'digipin', 'mapFrame');
        }
        if (c.familyMembers) c.familyMembers.forEach(f => addFamilyMember(f));
      }
    }
  });
</script>
</body>
</html>
