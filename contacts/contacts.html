<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Contact</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    .photo-preview {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px dashed var(--border);
      object-fit: cover;
      display: block;
      margin-top: 8px;
    }

    .map-container {
      width: 100%;
      height: 200px;
      background: #e2e8f0;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .family-member-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-danger {
      background-color: #ef4444;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Contact Entry Form</h2>
  <form id="contactForm" onsubmit="handleFormSubmit(event)">
    
    <!-- Photo Section -->
    <div class="form-group">
      <label for="photoInput">Profile Photo</label>
      <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(event)">
      <img id="photoPreview" class="photo-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%2394a3b8' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="Preview">
    </div>

    <!-- Basic Information -->
    <div class="form-group">
      <label for="fullName">Full Name *</label>
      <input type="text" id="fullName" required placeholder="John Doe">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" required placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="john@example.com">
      </div>
    </div>

    <!-- Identity Information -->
    <div class="row">
      <div class="form-group">
        <label for="aadhaar">Aadhaar Number</label>
        <input type="text" id="aadhaar" placeholder="XXXX-XXXX-XXXX" maxlength="14" pattern="\d{4}-\d{4}-\d{4}">
      </div>
      <div class="form-group">
        <label for="pan">PAN Card Number</label>
        <input type="text" id="pan" placeholder="ABCDE1234F" maxlength="10" style="text-transform: uppercase;">
      </div>
    </div>

    <!-- Address & Location Details -->
    <div class="form-group">
      <label for="digipin">DIGIPIN</label>
      <input type="text" id="digipin" placeholder="e.g. 3J8-2K1-L09">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="latitude">Latitude</label>
        <input type="number" step="any" id="latitude" placeholder="28.6139" onchange="updateMapEmbed()">
      </div>
      <div class="form-group">
        <label for="longitude">Longitude</label>
        <input type="number" step="any" id="longitude" placeholder="77.2090" onchange="updateMapEmbed()">
      </div>
    </div>

    <div class="form-group">
      <button type="button" class="btn-secondary" onclick="getCurrentLocation()">Get Current Coordinates</button>
    </div>

    <!-- Map Embed Preview -->
    <div class="form-group">
      <label>Location Preview</label>
      <div class="map-container">
        <iframe id="mapFrame" src="about:blank"></iframe>
      </div>
    </div>

    <!-- Dynamic Family Members -->
    <div class="form-group">
      <label>Family Members</label>
      <div id="familyContainer"></div>
      <button type="button" class="btn-secondary" onclick="addFamilyMember()">+ Add Family Member</button>
    </div>

    <button type="submit" class="btn-submit">Save Contact</button>
  </form>
</div>

<script>
  // Photo preview logic
  function previewPhoto(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('photoPreview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  // Auto-format Aadhaar with dashes
  document.getElementById('aadhaar').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 12) value = value.slice(0, 12);
    let formatted = value.match(/.{1,4}/g)?.join('-') || '';
    e.target.value = formatted;
  });

  // Get current device location
  function getCurrentLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        document.getElementById('latitude').value = position.coords.latitude;
        document.getElementById('longitude').value = position.coords.longitude;
        updateMapEmbed();
      }, () => {
        alert("Unable to fetch current position.");
      });
    } else {
      alert("Geolocation is not supported by your browser.");
    }
  }

  // Update Google Maps embed iframe dynamically
  function updateMapEmbed() {
    const lat = document.getElementById('latitude').value;
    const lng = document.getElementById('longitude').value;
    const frame = document.getElementById('mapFrame');

    if (lat && lng) {
      frame.src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
    }
  }

  // Add family member row dynamically
  function addFamilyMember() {
    const container = document.getElementById('familyContainer');
    const row = document.createElement('div');
    row.className = 'family-member-row';

    row.innerHTML = `
      <input type="text" placeholder="Name" class="fam-name" required>
      <select class="fam-relation">
        <option value="Spouse">Spouse</option>
        <option value="Child">Child</option>
        <option value="Parent">Parent</option>
        <option value="Sibling">Sibling</option>
        <option value="Other">Other</option>
      </select>
      <button type="button" class="btn-danger" onclick="this.parentElement.remove()">X</button>
    `;

    container.appendChild(row);
  }

  // Submit Handler
  function handleFormSubmit(e) {
    e.preventDefault();

    // Collect family members
    const familyMembers = [];
    document.querySelectorAll('.family-member-row').forEach(row => {
      familyMembers.push({
        name: row.querySelector('.fam-name').value,
        relation: row.querySelector('.fam-relation').value
      });
    });

    const contactData = {
      fullName: document.getElementById('fullName').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      aadhaar: document.getElementById('aadhaar').value,
      pan: document.getElementById('pan').value,
      digipin: document.getElementById('digipin').value,
      coordinates: {
        lat: document.getElementById('latitude').value,
        lng: document.getElementById('longitude').value
      },
      familyMembers: familyMembers
    };

    console.log("Contact Data Saved:", contactData);
    alert("Contact info captured successfully! (Check console for output object)");
  }
</script>

</body>
</html>
